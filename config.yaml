# config.yaml - every tunable number for the project lives here.
# Scripts read this file; no magic numbers in code.

# Where files are stored (relative to project root)
paths:
  raw_include: data/raw/include   # downloaded INCLUDE videos
  raw_custom: data/raw/custom     # my own recorded clips
  keypoints: data/keypoints       # extracted landmarks, one .npy per video
  reports: reports                # metrics, plots, confusion matrices
  checkpoints: checkpoints        # saved models (best.pt, labels.json)

# Dataset settings
data:
  dataset: INCLUDE-50       # 50-word subset of the INCLUDE ISL dataset
  zenodo_record: 4010759    # zenodo.org record that hosts INCLUDE
  num_classes: 50           # number of words the model predicts
  custom_words: []          # extra words I record myself (fill later)
  clip_seconds: 2.0         # length of each custom recording
  record_fps: 30            # webcam frames per second when recording
  clips_per_word: 30        # target number of custom clips per word

# Landmark extraction (MediaPipe)
keypoints:
  T: 32                     # frames per clip after resampling (fixed model input length)
  num_hands: 2              # left + right hand
  hand_landmarks: 21        # MediaPipe gives 21 points per hand
  coords: 3                 # x, y, z for each point
  pose_landmarks:           # upper-body points we keep (MediaPipe pose indices)
    nose: 0
    left_shoulder: 11
    right_shoulder: 12
    left_elbow: 13
    right_elbow: 14
    left_wrist: 15
    right_wrist: 16
  use_presence_flags: true  # add a 0/1 flag per hand: 1 = hand seen, 0 = missing (zeros)

# Training-time data augmentation (random, small changes so the model generalises)
augment:
  rotate_deg: 10            # rotate landmarks by up to +/- 10 degrees
  scale: 0.1                # scale size by up to +/- 10%
  shift: 0.05               # move position by up to +/- 0.05 (normalised units)
  time_stretch: 0.2         # speed the sign up / slow it down by up to 20%
  frame_drop: 0.1           # randomly drop 10% of frames
  noise_std: 0.01           # add small gaussian noise to coordinates

# Model choice and size
model:
  type: gru                 # which model to train: gru | transformer
  gru:                      # baseline: recurrent network
    hidden: 128             # size of GRU hidden state
    layers: 2               # stacked GRU layers
    bidirectional: true     # read the sequence forwards and backwards
    dropout: 0.3            # fraction of units dropped during training
  transformer:              # small attention-based encoder
    d_model: 128            # size of each frame's feature vector inside the model
    layers: 2               # number of encoder layers
    heads: 4                # attention heads per layer
    ff_dim: 256             # hidden size of the feed-forward block
    dropout: 0.1

# Training loop
train:
  seed: 42                  # fixed random seed -> repeatable results
  batch_size: 32            # clips per training step
  epochs: 100               # maximum epochs (early stopping may end sooner)
  lr: 0.001                 # learning rate for AdamW
  weight_decay: 0.01        # AdamW regularisation
  patience: 15              # stop if val accuracy hasn't improved for 15 epochs
  val_fraction: 0.1         # 10% of training data held out for validation
  class_weighted_loss: true # give rare words more weight in the loss
  device: auto              # auto = use Apple MPS GPU if available, else CPU

# Live recognition app
live:
  window: 32                # model looks at the last 32 frames
  predict_every: 4          # run the model once every 4 frames
  conf_threshold: 0.8       # only accept predictions with >= 80% confidence
  vote_window: 5            # look at the last 5 predictions...
  vote_min: 3               # ...and need the same word in at least 3 of them
  cooldown_s: 1.0           # wait 1 s before emitting another word
  idle_clear_s: 3.0         # clear the sentence after 3 s with no hands
  max_lines: 4              # lines of history kept on screen

# Camera input
camera:
  source: 0                 # 0 = laptop webcam, or MJPEG URL e.g. http://<esp32cam-ip>:81/stream

# Wi-Fi link to the glasses (ESP32-C3)
network:
  glasses_host: glasses.local   # mDNS name the ESP32 registers
  udp_port: 4210                # UDP port the glasses listen on
  no_link_timeout_s: 10         # glasses show "NO LINK" after 10 s without packets
