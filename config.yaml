# config.yaml - tunable values for the glasses side of the project.
# The recognizer app (friend's software, branch S1) keeps its own ML settings.
# Packet contract between the app and the glasses: docs/interface.md

# Wi-Fi link to the glasses (ESP32-C3)
network:
  glasses_host: glasses.local   # mDNS name the ESP32 registers
  udp_port: 4210                # UDP port the glasses listen on
  no_link_timeout_s: 10         # glasses show "NO LINK" after 10 s without packets
