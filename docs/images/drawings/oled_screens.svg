<text x="160.0" y="75.0" font-family="Menlo, Consolas, monospace" font-size="50.0" fill="#cfe8ff" text-anchor="middle">READY</text>
<text x="160.0" y="117.5" font-family="Menlo, Consolas, monospace" font-size="25.0" fill="#cfe8ff" text-anchor="middle">192.168.43.57</text>
</svg>
<text x="785.0" y="170.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">2. Ready</text>
<text x="785.0" y="408.0" font-size="17" fill="#1f4fa0" text-anchor="middle" font-weight="normal">IP shown; also reachable as</text>
<text x="785.0" y="432.0" font-size="17" fill="#1f4fa0" text-anchor="middle" font-weight="normal">glasses.local, UDP port 4210</text>
<g filter="url(#rough)"><rect x="1146.0" y="186.0" width="348.0" height="188.0" rx="10" fill="#2a2f3a" stroke="#1e1e1e" stroke-width="2.4"/></g>
<rect x="1160.0" y="200.0" width="320.0" height="160.0" rx="0" fill="#05070c" stroke="#05070c" stroke-width="1"/>
