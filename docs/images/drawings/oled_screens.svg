<text x="160.0" y="95.0" font-family="Menlo, Consolas, monospace" font-size="50.0" fill="#cfe8ff" text-anchor="middle">HELLO</text>
</svg>
<text x="1320.0" y="170.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">3. A word (fits 128 px)</text>
<text x="1320.0" y="408.0" font-size="17" fill="#1f4fa0" text-anchor="middle" font-weight="normal">size 2, centred</text>
<text x="1320.0" y="432.0" font-size="17" fill="#1f4fa0" text-anchor="middle" font-weight="normal">&lt;= 10 characters</text>
<g filter="url(#rough)"><rect x="76.0" y="626.0" width="348.0" height="188.0" rx="10" fill="#2a2f3a" stroke="#1e1e1e" stroke-width="2.4"/></g>
<rect x="90.0" y="640.0" width="320.0" height="160.0" rx="0" fill="#05070c" stroke="#05070c" stroke-width="1"/>
