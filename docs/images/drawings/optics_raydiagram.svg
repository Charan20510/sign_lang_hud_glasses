<text x="1175.0" y="880.0" font-size="26" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Thin-lens equation</text>
<text x="808.0" y="925.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">1/u + 1/v = 1/f   (real-is-positive),   m = -v/u</text>
<text x="808.0" y="955.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">u &lt; f  ->  v &lt; 0: virtual, upright, magnified</text>
<text x="808.0" y="985.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">The bench focus (u = 22) shows the real f is ~25,</text>
