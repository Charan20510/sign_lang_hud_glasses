<text x="989.0" y="203.0" font-size="18" fill="#1f4fa0" text-anchor="end" font-weight="normal">USB-C at rear</text>
<line x1="694.0" y1="194.0" x2="736.0" y2="310.0" stroke="#1f4fa0" stroke-width="1.3" stroke-linecap="round"/>
<text x="688.0" y="200.0" font-size="18" fill="#1f4fa0" text-anchor="end" font-weight="normal">Slide switch (top wall)</text>
<line x1="645.0" y1="570.0" x2="897.0" y2="436.0" stroke="#1f4fa0" stroke-width="1.3" stroke-linecap="round"/>
<text x="651.0" y="576.0" font-size="18" fill="#1f4fa0" text-anchor="start" font-weight="normal">TP4056 Type-C (protection)</text>
<text x="651.0" y="599.0" font-size="18" fill="#1f4fa0" text-anchor="start" font-weight="normal">LiPo 600 mAh, 30 x 20 x 6</text>
<text x="651.0" y="622.0" font-size="18" fill="#1f4fa0" text-anchor="start" font-weight="normal">charge leads exit dia 3.5</text>
<text x="662.5" y="941.0" font-size="19" fill="#1e1e1e" text-anchor="middle" font-weight="normal">SIDE VIEW (left = front, rear faces the ear; width into page = 29 internal)</text>
<rect x="1090.0" y="125.0" width="480.0" height="470.0" rx="10" fill="#fffdf8" stroke="#1e1e1e" stroke-width="2.2"/>
<text x="1330.0" y="165.0" font-size="26" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Why these distances?</text>
<text x="1118.0" y="210.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">OLED -> lens centre  u = 22  (bench, sharp)</text>
<text x="1118.0" y="239.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">lens focal length  f ~ 25  (estimate)</text>
<text x="1118.0" y="268.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">u &lt; f  ->  virtual, upright image</text>
<text x="1118.0" y="297.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal"></text>
<text x="1118.0" y="326.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">1/v = 1/f - 1/u = 1/25 - 1/22 = -3/550</text>
<text x="1118.0" y="355.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">v ~ -183  (virtual)</text>
<text x="1118.0" y="384.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">magnification m = |v/u| ~ 8.3x</text>
<text x="1118.0" y="413.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal"></text>
<text x="1118.0" y="442.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">=> text floats ~18 cm in front of the lens</text>
<text x="1118.0" y="471.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">lens -> acrylic = 25 only sets eye level</text>
<rect x="1090.0" y="615.0" width="480.0" height="440.0" rx="10" fill="#fffdf8" stroke="#1e1e1e" stroke-width="2.2"/>
<text x="1330.0" y="655.0" font-size="26" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Build notes</text>
<text x="1118.0" y="700.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">1. Focus: move the OLED to slot 19 or 25</text>
<text x="1118.0" y="733.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">   if the text is blurry.</text>
<text x="1118.0" y="766.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">2. Print in matte black PLA: no painting.</text>
<text x="1118.0" y="799.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">3. Acrylic must be 29 - 30.4 wide to fit.</text>
<text x="1118.0" y="832.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">4. Text backwards / upside down:</text>
<text x="1118.0" y="865.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">   MIRROR_X / FLIP_Y in firmware.</text>
<text x="1118.0" y="898.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">5. Clip on the right arm, ~2 cm behind</text>
<text x="1118.0" y="931.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">   the hinge; slide the unit from the rear.</text>
<text x="1118.0" y="964.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">6. Print test_fit.stl first if unsure.</text>
</svg>
