<text x="46.0" y="568.0" font-size="18" fill="#1f4fa0" text-anchor="start" font-weight="normal">(marked f45) on</text>
<text x="46.0" y="591.0" font-size="18" fill="#1f4fa0" text-anchor="start" font-weight="normal">plate 6 below floor</text>
