<text x="1025.0" y="758.0" font-size="17" fill="#1e1e1e" text-anchor="middle" font-weight="normal">(to eye level)</text>
<line x1="270.0" y1="520.0" x2="270.0" y2="821.0" stroke="#1e1e1e" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="260.0" y="676.5" font-size="17" fill="#1e1e1e" text-anchor="end" font-weight="normal">43</text>
<line x1="570.7" y1="401.0" x2="570.7" y2="555.0" stroke="#c0392b" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="580.7" y="484.0" font-size="17" fill="#c0392b" text-anchor="start" font-weight="normal">u = 22</text>
<line x1="570.7" y1="555.0" x2="570.7" y2="730.0" stroke="#c0392b" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="580.7" y="648.5" font-size="17" fill="#c0392b" text-anchor="start" font-weight="normal">25</text>
<line x1="229.8" y1="385.0" x2="337.0" y2="387.0" stroke="#1f4fa0" stroke-width="1.3" stroke-linecap="round"/>
<text x="46.0" y="391.0" font-size="18" fill="#1f4fa0" text-anchor="start" font-weight="normal">0.96" OLED SSD1306,</text>
<text x="46.0" y="414.0" font-size="18" fill="#1f4fa0" text-anchor="start" font-weight="normal">screen down, slots</text>
<text x="46.0" y="437.0" font-size="18" fill="#1f4fa0" text-anchor="start" font-weight="normal">u = 19 / 22 / 25</text>
<line x1="229.8" y1="539.0" x2="348.6" y2="555.0" stroke="#1f4fa0" stroke-width="1.3" stroke-linecap="round"/>
