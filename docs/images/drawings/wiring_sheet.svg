<rect width="1600" height="1130" fill="#faf8f2"/>
<text x="800.0" y="48.0" font-size="40" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Sign-Language HUD Glasses  -  Wiring</text>
<text x="800.0" y="86.0" font-size="20" fill="#666" text-anchor="middle" font-weight="normal">Sheet 3 of 6  |  Display unit  |  red = +, black = GND, yellow = SCL, green = SDA</text>
<text x="1570.0" y="1106.0" font-size="18" fill="#666" text-anchor="end" font-weight="normal">Drawn by: Charan  |  ECE, IIIT Senapati, Manipur  |  Enclosure v3.1</text>
