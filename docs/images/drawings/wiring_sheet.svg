<text x="160.0" y="252.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">LiPo 3.7 V 600 mAh</text>
<text x="160.0" y="277.0" font-size="17" fill="#666" text-anchor="middle" font-weight="normal">(602030)</text>
<text x="228.0" y="346.0" font-size="17" fill="#c0392b" text-anchor="end" font-weight="normal">+ red</text>
<text x="228.0" y="406.0" font-size="17" fill="#1e1e1e" text-anchor="end" font-weight="normal">- black</text>
<text x="470.0" y="225.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">TP4056 Type-C</text>
<text x="470.0" y="505.0" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="normal">USB-C taped "NO USB"</text>
<text x="382.0" y="326.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">B+</text>
<text x="382.0" y="406.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">B-</text>
<text x="558.0" y="326.0" font-size="18" fill="#1e1e1e" text-anchor="end" font-weight="normal">OUT+</text>
<text x="558.0" y="406.0" font-size="18" fill="#1e1e1e" text-anchor="end" font-weight="normal">OUT-</text>
<text x="707.0" y="250.0" font-size="18" fill="#1e1e1e" text-anchor="middle" font-weight="normal">slide switch</text>
<text x="985.0" y="185.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">ESP32-C3 SuperMini</text>
<text x="872.0" y="286.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">5V</text>
<text x="872.0" y="351.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">G</text>
<text x="1098.0" y="266.0" font-size="18" fill="#1e1e1e" text-anchor="end" font-weight="normal">3V3</text>
<text x="1098.0" y="321.0" font-size="18" fill="#1e1e1e" text-anchor="end" font-weight="normal">G</text>
<text x="1098.0" y="376.0" font-size="18" fill="#1e1e1e" text-anchor="end" font-weight="normal">GPIO9 (SCL)</text>
<text x="1098.0" y="431.0" font-size="18" fill="#1e1e1e" text-anchor="end" font-weight="normal">GPIO8 (SDA)</text>
<text x="1405.0" y="205.0" font-size="21" fill="#1e1e1e" text-anchor="middle" font-weight="normal">0.96" OLED (SSD1306)</text>
<text x="1322.0" y="266.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">VDD</text>
<text x="1322.0" y="321.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">GND</text>
<text x="1322.0" y="376.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">SCK</text>
<text x="1322.0" y="431.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="normal">SDA</text>
<text x="80.0" y="575.0" font-size="19" fill="#1f4fa0" text-anchor="start" font-weight="normal">Power: LiPo -> TP4056 (charge + protection) -> switch -> ESP32-C3 5V pin (on-board 3.3 V regulator)  |  OLED on I2C, address 0x3C</text>
<rect x="80.0" y="630.0" width="690.0" height="420.0" rx="10" fill="#fffdf8" stroke="#1e1e1e" stroke-width="2.2"/>
<text x="425.0" y="670.0" font-size="26" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Safety (LiPo charging)</text>
<text x="108.0" y="715.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">- Charge ONLY from a bench supply on B+ / B-:</text>
<text x="108.0" y="751.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">  4.20 V, 0.30 A limit, stop at &lt;= 0.05 A.</text>
<text x="108.0" y="787.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">- Stock TP4056 charges at 1 A = 1.7C: too much</text>
<text x="108.0" y="823.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">  for 600 mAh, so its USB port is taped.</text>
<text x="108.0" y="859.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">- Never plug the ESP32 USB-C while the switch</text>
<text x="108.0" y="895.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">  is ON.</text>
<text x="108.0" y="931.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">- Solder battery leads one at a time; tape.</text>
<rect x="830.0" y="630.0" width="740.0" height="420.0" rx="10" fill="#fffdf8" stroke="#1e1e1e" stroke-width="2.2"/>
<text x="1200.0" y="670.0" font-size="26" fill="#1e1e1e" text-anchor="middle" font-weight="normal">Measured (Rigol DM3058E)</text>
<text x="858.0" y="715.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">ESP32-C3 5V pin, on USB ........ 5.162 V</text>
<text x="858.0" y="751.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">ESP32-C3 3V3 pin, on USB ....... 3.302 V</text>
<text x="858.0" y="787.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">LiPo #1 as received ............ 3.999 V</text>
<text x="858.0" y="823.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">5V pin on battery, under load .. 3.967 V</text>
<text x="858.0" y="859.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal"></text>
<text x="858.0" y="895.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">On battery the 5V pin reads the cell voltage;</text>
<text x="858.0" y="931.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">3V3 stays regulated.</text>
<text x="858.0" y="967.0" font-size="19" fill="#1e1e1e" text-anchor="start" font-weight="normal">I2C scan: OLED found at 0x3C (both OLEDs).</text>
</svg>
