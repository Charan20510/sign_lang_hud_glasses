<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Helvetica, Arial, sans-serif">
  <!-- solid card so the diagram reads on light and dark GitHub themes -->
  <rect x="0" y="0" width="960" height="470" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Glasses display unit: wiring</text>

  <!-- LiPo -->
  <rect x="30" y="90" width="150" height="110" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="105" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">LiPo 3.7 V</text>
  <text x="105" y="142" text-anchor="middle" font-size="12" fill="#334155">600 mAh (602030)</text>
  <text x="166" y="172" text-anchor="end" font-size="12" fill="#dc2626">red +</text>
  <text x="166" y="192" text-anchor="end" font-size="12" fill="#0f172a">black −</text>

  <!-- TP4056 -->
  <rect x="250" y="80" width="170" height="140" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="335" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">TP4056</text>
  <text x="335" y="126" text-anchor="middle" font-size="11" fill="#334155">USB-C taped "NO USB"</text>
  <text x="262" y="172" font-size="12" fill="#0f172a">B+</text>
  <text x="262" y="192" font-size="12" fill="#0f172a">B−</text>
  <text x="408" y="152" text-anchor="end" font-size="12" fill="#0f172a">OUT+</text>
  <text x="408" y="202" text-anchor="end" font-size="12" fill="#0f172a">OUT−</text>

  <!-- Switch -->
  <rect x="480" y="122" width="110" height="56" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="535" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Slide switch</text>
  <text x="535" y="166" text-anchor="middle" font-size="11" fill="#334155">middle ↔ side pin</text>

  <!-- ESP32-C3 -->
  <rect x="650" y="70" width="140" height="330" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="720" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">ESP32-C3</text>
  <text x="720" y="118" text-anchor="middle" font-size="12" fill="#334155">SuperMini</text>
  <text x="662" y="152" font-size="12" fill="#0f172a">5V</text>
  <text x="662" y="202" font-size="12" fill="#0f172a">G</text>
  <text x="778" y="262" text-anchor="end" font-size="12" fill="#0f172a">3V3</text>
  <text x="778" y="292" text-anchor="end" font-size="12" fill="#0f172a">G</text>
  <text x="778" y="322" text-anchor="end" font-size="12" fill="#0f172a">GPIO8</text>
  <text x="778" y="352" text-anchor="end" font-size="12" fill="#0f172a">GPIO9</text>

  <!-- OLED -->
  <rect x="840" y="230" width="100" height="140" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="890" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">0.96" OLED</text>
  <text x="852" y="262" font-size="12" fill="#0f172a">VDD</text>
  <text x="852" y="292" font-size="12" fill="#0f172a">GND</text>
  <text x="852" y="322" font-size="12" fill="#0f172a">SDA</text>
  <text x="852" y="352" font-size="12" fill="#0f172a">SCK</text>

  <!-- Wires: power -->
  <line x1="180" y1="168" x2="250" y2="168" stroke="#dc2626" stroke-width="3"/>
  <line x1="180" y1="188" x2="250" y2="188" stroke="#0f172a" stroke-width="3"/>
  <line x1="420" y1="148" x2="480" y2="148" stroke="#dc2626" stroke-width="3"/>
  <line x1="590" y1="148" x2="650" y2="148" stroke="#dc2626" stroke-width="3"/>
  <line x1="420" y1="198" x2="650" y2="198" stroke="#0f172a" stroke-width="3"/>

  <!-- Wires: OLED -->
  <line x1="790" y1="258" x2="840" y2="258" stroke="#dc2626" stroke-width="3"/>
  <line x1="790" y1="288" x2="840" y2="288" stroke="#0f172a" stroke-width="3"/>
  <line x1="790" y1="318" x2="840" y2="318" stroke="#2563eb" stroke-width="3"/>
  <line x1="790" y1="348" x2="840" y2="348" stroke="#ca8a04" stroke-width="3"/>

  <!-- Notes -->
  <rect x="30" y="250" width="590" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="278" font-size="14" font-weight="bold" fill="#0f172a">Notes</text>
  <text x="48" y="304" font-size="12.5" fill="#334155">• OLED on I2C: SDA = GPIO8, SCK (= SCL) = GPIO9, VDD (= VCC) = 3V3, address 0x3C.</text>
  <text x="48" y="328" font-size="12.5" fill="#334155">• Battery: OUT+ → switch middle, switch side → ESP32 5V pin; OUT− → G.</text>
  <text x="48" y="352" font-size="12.5" fill="#334155">• Charge only with a bench supply on B+/B−: 4.20 V, 0.30 A limit, stop at ≤ 0.05 A.</text>
  <text x="48" y="376" font-size="12.5" fill="#334155">• Never plug USB into the TP4056 with a cell on it (stock board charges at 1 A).</text>
  <text x="48" y="400" font-size="12.5" fill="#334155">• Never plug the ESP32 USB-C while the switch is ON.</text>
  <text x="48" y="424" font-size="12.5" fill="#334155">• On battery the ESP32 5V pin reads the cell voltage (3.7–4.2 V); 3V3 stays ≈ 3.3 V.</text>
</svg>
